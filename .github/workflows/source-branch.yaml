name: Source branch

on:
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Source branch
    runs-on: ubuntu-24.04
    steps:
      - name: Only develop, release/* and hotfix/* may merge into master
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests from forks go to develop, not master."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|release/*|hotfix/*) echo "$HEAD_REF may merge into master." ;;
            *) echo "::error::$HEAD_REF can't merge into master: open the pull request against develop."; exit 1 ;;
          esac
